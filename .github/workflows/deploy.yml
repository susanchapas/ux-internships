name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  # The scanner's durable "already alerted" state is committed after each run.
  # A GitHub Actions cache cannot be used for this: cache entries are immutable,
  # so a fixed cache key keeps restoring an old seen.json.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Scan jobs and notify
        if: github.event_name != 'push'
        run: python internship_watch.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Scan jobs (no notify on push)
        if: github.event_name == 'push'
        run: python internship_watch.py

      - name: Persist alerted-job state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seen.json
          git diff --cached --quiet || git commit -m "chore: update alerted job state [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - run: python build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
